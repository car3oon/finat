name: CI Pipeline

on:
  push:
    branches: ['main']
  pull_request:

# Zatrzymuje poprzedni przebieg na tym samym branchu po wypchnięciu nowych zmian
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      # Instaluje zależności zgodnie z lockfilem i uruchamia postinstall (nuxt prepare)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build project
        run: pnpm build
